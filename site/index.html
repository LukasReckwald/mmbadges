<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>mmbadges – modern minimal badges for Markdown</title>
    <meta
      name="description"
      content="mmbadges – modern minimal badges for Markdown. Pill-shaped badges with 3000+ brand logos and automatic light and dark mode."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://mmbadges.com/" />
    <!-- Link previews (Discord, Slack, X, LinkedIn …); og.png comes from `npm run banner -- --og` -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mmbadges.com/" />
    <meta property="og:title" content="mmbadges – modern minimal badges for Markdown" />
    <meta
      property="og:description"
      content="Pill-shaped README badges with 3000+ brand logos, live status from GitHub, npm and Codecov, and automatic light and dark mode."
    />
    <meta property="og:image" content="https://mmbadges.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
