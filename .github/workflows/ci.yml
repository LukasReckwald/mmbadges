name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run site:build
      # Bundles the worker without deploying – fails if it no longer builds
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Check bundle size (free plan limit is 3 MB gzip)
        run: |
          size=$(gzip -c dist/index.js | wc -c)
          echo "Worker bundle: $((size / 1024)) KiB gzip"
          test "$size" -lt 3000000
